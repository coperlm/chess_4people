name: Auto Tag & Release

# 只要把 package.json 的 version 改大并 push，就自动打上同名 tag 并创建 Release。
# 应用内的版本号是“运行时读取 package.json”，所以无需别处再改。
on:
  push:
    branches: [ "回溯到不登录", main, master ]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 按 package.json 自动打标签 / 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "标签 $TAG 已存在，跳过"
            exit 0
          fi
          # 取“上一个标签”作为日志起点（必须在打新标签之前取，否则会取到新标签本身）
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          # 用两个标签之间的提交信息生成更新日志：
          # 本仓库是直接 push（无 PR），GitHub 的 --generate-notes 只列合并的 PR，会得到空正文，
          # 所以这里改为直接读提交历史，保证每个版本都有内容。
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          BODY=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%h)")
          [ -z "$BODY" ] && BODY="- （本次无新提交）"
          {
            printf '## 更新日志\n\n%s\n\n' "$BODY"
            if [ -n "$PREV" ]; then
              printf '**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "${{ github.server_url }}" "${{ github.repository }}" "$PREV" "$TAG"
            fi
          } > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md || true
