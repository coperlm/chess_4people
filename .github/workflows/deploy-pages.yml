name: Deploy to GitHub Pages

on:
  # 只在“分支推送”时触发；标签推送不触发（GitHub Pages 环境不允许由 tag 部署）
  push:
    branches: [ "回溯到不登录", main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 规则 & 联机协议回归测试
        run: npm test

  deploy:
    needs: test
    # 兜底：仅分支可部署（tag/其它 ref 直接跳过）
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/configure-pages@v5
      # TURN 凭据不入库：部署时从 Secret 生成 js/utils/ice-secrets.js 再上传（缺失则仅用 STUN）
      - name: 注入 TURN 凭据
        env:
          CHESS4P_TURN_JSON: ${{ secrets.CHESS4P_TURN_JSON }}
        run: node tools/inject-ice.js
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
